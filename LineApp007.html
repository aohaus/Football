<style>

.theme-away-white input,.theme-away-white select,.theme-away-lines input,.theme-away-lines select{background:rgba(255,255,255,.85);color:#111;border-color:rgba(0,0,0,.18)}

.pitch{position:relative;min-height:570px;border-radius:24px;overflow:hidden;background:linear-gradient(90deg,rgba(255,255,255,.035) 50%,transparent 50%) 0 0/92px 100%,radial-gradient(ellipse at center,rgba(255,255,255,.14),transparent 55%),var(--pitch);border:2px solid var(--line)}
.pitch:before{content:"";position:absolute;inset:18px;border:1.5px solid var(--line);border-radius:18px;pointer-events:none}
.halfline{position:absolute;left:18px;right:18px;top:50%;height:1px;background:var(--line)} .circle{position:absolute;left:50%;top:50%;width:112px;height:112px;transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:50%}

.spot{position:absolute;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--line);z-index:1} .spot.top{top:108px} .spot.bottom{bottom:108px}
.slot{position:absolute;transform:translate(-50%,-50%);width:31%;z-index:2} .slot select{text-align:center;font-weight:800;font-size:13px;padding:8px 4px;min-height:40px} .pos{display:inline-block;font-size:9px;color:var(--bg);background:var(--accent);padding:2px 6px;border-radius:999px;font-weight:900;margin-bottom:3px}

.out label{color:var(--danger)} .in label{color:var(--green)}

@media(max-width:390px){.slot{width:34%}.slot select{font-size:12px}.pitch{min-height:545px}}

 "group": "MF", "pos": "DMF/CM", "club": "マインツ05", "flag": "🇩🇪", "note": ""}, {"no": "8", "full": "久保 建英", "short": "久保", "group": "FW", "pos": "シャドー/RW", "club": "レアル・ソシエダード", "flag": "🇪🇸", "note": ""}, {"no": "9", "full": "後藤 啓介", "short": "後藤", "group": "FW", "pos": "CF", "club": "シントトロイデンVV", "flag": "🇧🇪", "note": ""}, {"no": "10", "full": "堂安 律", "short": "堂安", "group": "FW", "pos": "シャドー/RWB", "club": "アイントラハト・フランクフルト", "flag": "🇩🇪", "note": ""}, {"no": "11", "full": "前田 大然", "short": "前田", "group": "FW", "pos": "CF/LW", "club": "セルティック", "flag": "🏴󠁧󠁢󠁳󠁣󠁴󠁿", "note": ""}, {"no": "13", "full": "中村 敬斗", "short": "中村", "group": "FW", "pos": "LW/シャドー", "club": "スタッド・ランス", "flag": "🇫🇷", "note": ""}, {"no": "14", "full": "伊東 純也", "short": "伊東", "group": "FW", "pos": "RW/RWB", "club": "KRCゲンク", "flag": "🇧🇪", "note": ""}, {"no": "17", "full": "鈴木 唯人", "short": "鈴木唯", "group": "FW", "pos": "シャドー/AMF", "club": "SCフライブルク", "flag": "🇩🇪", "note": ""}, {"no": "18", "full": "上田 綺世", "short": "上田", "group": "FW", "pos": "CF", "club": "フェイエノールト", "flag": "🇳🇱", "note": ""}, {"no": "19", "full": "小川 航基", "short": "小川", "group": "FW", "pos": "CF", "club": "NECナイメヘン", "flag": "🇳🇱", "note": ""}, {"no": "26", "full": "塩貝 健人", "short": "塩貝", "group": "FW", "pos": "CF", "club": "VfLヴォルフスブルク", "flag": "🇩🇪", "note": ""}];
const formations = {
 '3-4-2-1': [['CF',50,10],['ST',35,24],['ST',65,24],['LWB',18,43],['CM',40,46],['CM',60,46],['RWB',82,43],['LCB',28,70],['CB',50,74],['RCB',72,70],['GK',50,91]],

 '4-2-3-1': [['CF',50,10],['LW',25,27],['AMF',50,30],['RW',75,27],['DMF',40,50],['DMF',60,50],['LB',18,72],['CB',40,76],['CB',60,76],['RB',82,72],['GK',50,91]],
 '4-3-3': [['LW',25,15],['CF',50,10],['RW',75,15],['IH',32,40],['DMF',50,48],['IH',68,40],['LB',18,72],['CB',40,76],['CB',60,76],['RB',82,72],['GK',50,91]],
 '4-4-2': [['CF',40,12],['CF',60,12],['LM',22,37],['CM',42,45],['CM',58,45],['RM',78,37],['LB',18,72],['CB',40,76],['CB',60,76],['RB',82,72],['GK',50,91]]
};
const key='lineapp007';
const groupOrder=['FW','MF','DF','GK'];
const byVal=v=>players.find(p=>String(p.no)===String(v));
const label=p=>p?`${p.no} ${p.short}${p.note?' *':''}`:'';
const full=p=>p?`${p.no} ${p.short}（${p.pos} / ${p.club}${p.flag}${p.note?' / '+p.note:''}）`:'';
function selectedValues(){return new Set([...document.querySelectorAll('.playerSelect')].map(s=>s.value).filter(Boolean))}
function makeOptions(current='', limited=null){
 let selected=selectedValues(), html='<option value="">未選択</option>';
 for(const g of groupOrder){
   const ps=players.filter(p=>p.group===g && (!limited || limited.includes(String(p.no)))).sort((a,b)=>String(a.no).localeCompare(String(b.no),'ja',{numeric:true}));
   html+=`<optgroup label="--- ${g} ---">`;
   ps.forEach(p=>{const v=String(p.no), used=selected.has(v)&&v!==String(current); html+=`<option value="${v}" ${used?'disabled':''}>${used?'✓ ':''}${label(p)}　${p.pos}</option>`});
   html+='</optgroup>';
 }
 return html;
}
function updateSelectOptions(){
 document.querySelectorAll('select.playerSelect').forEach(sel=>{const cur=sel.value; const limited=sel.dataset.limited?sel.dataset.limited.split(','):null; sel.innerHTML=makeOptions(cur,limited); sel.value=cur;});
}
function renderFormationOptions(){formation.innerHTML=Object.keys(formations).map(f=>`<option>${f}</option>`).join('')}
function renderPitch(){
 const prev=[...document.querySelectorAll('.starter')].map(s=>s.value), prevCap=captain.value;
 pitch.querySelectorAll('.slot').forEach(n=>n.remove());
 formations[formation.value].forEach((s,i)=>{const [pos,x,y]=s; const d=document.createElement('div'); d.className='slot'; d.style.left=x+'%'; d.style.top=y+'%'; d.innerHTML=`<span class="pos">${pos}</span><select id="starter${i}" class="starter playerSelect" data-pos="${pos}"></select>`; pitch.appendChild(d)});

 captain.value=prevCap; bindStarters(); refresh();
}
function bindStarters(){document.querySelectorAll('.starter').forEach(s=>s.onchange=refresh)}
function getStarters(){return [...document.querySelectorAll('.starter')].map(s=>s.value).filter(Boolean)}
function refreshCaptain(){
 const prev=captain.value, starters=getStarters(); captain.innerHTML='<option value="">未選択</option>'+starters.map(v=>`<option value="${v}">${full(byVal(v))}</option>`).join('');
 if(starters.includes(prev)) captain.value=prev;

 document.querySelectorAll('.slot').forEach(slot=>{const s=slot.querySelector('select'); slot.classList.toggle('captain',s&&s.value===captain.value&&s.value)});
}
function renderSubs(){
 subs.innerHTML='';
 for(let i=0;i<5;i++){const d=document.createElement('div'); d.className='subrow'; d.innerHTML=`<div class="out"><label>OUT ${i+1}</label><select id="subOut${i}" class="playerSelect subOut"></select></div><div class="in"><label>IN ${i+1}</label><select id="subIn${i}" class="playerSelect"></select></div>`; subs.appendChild(d)}
}
function refreshSubOut(){
 const starters=getStarters();
 document.querySelectorAll('.subOut').forEach(sel=>{const cur=sel.value; sel.dataset.limited=starters.join(','); sel.innerHTML=makeOptions(cur,starters); if(starters.includes(cur)) sel.value=cur;});
}
function refreshScore(){const n=id=>Math.max(0,parseInt(document.getElementById(id).value||'0',10)); scoreTotal.textContent=`日本 ${n('fhJ')+n('shJ')} - ${n('fhN')+n('shN')} オランダ`;}
function renderRoster(){
 const sel=selectedValues(); roster.innerHTML='';
 for(const g of groupOrder){
   const h=document.createElement('div'); h.className='roster-section'; h.textContent=g; roster.appendChild(h);
   players.filter(p=>p.group===g).sort((a,b)=>String(a.no).localeCompare(String(b.no),'ja',{numeric:true})).forEach(p=>{const d=document.createElement('div'); d.className='player-card '+(sel.has(String(p.no))?'selected':''); d.innerHTML=`<div class="num">${p.no}</div><div><div class="pname">${p.full}</div><div class="meta">${p.pos} / ${p.club} ${p.flag}${p.note?' / '+p.note:''}</div></div>`; roster.appendChild(d)});
 }
}
function updateHero(){
 const name=managerName.value.trim()||'森保一'; heroName.textContent=name+' 監督';
 const t=theme.options[theme.selectedIndex]?.text||'Home Blue'; heroTheme.textContent=t; document.body.className=theme.value;
}
function updatePhoto(){document.documentElement.style.setProperty('--photo-scale',photoScale.value);document.documentElement.style.setProperty('--photo-x',photoX.value+'px');document.documentElement.style.setProperty('--photo-y',photoY.value+'px')}
function summaryText(){
 const name=managerName.value.trim()||'森保一', f=formation.value, c=byVal(captain.value);
 const n=id=>Math.max(0,parseInt(document.getElementById(id).value||'0',10));
 const xi=[...document.querySelectorAll('.starter')].map(s=>`${s.dataset.pos}: ${label(byVal(s.value))||'-'}${s.value&&s.value===captain.value?' ©':''}`).join('\n');
 let sub=[]; for(let i=0;i<5;i++){const o=byVal(document.getElementById('subOut'+i).value), inn=byVal(document.getElementById('subIn'+i).value); if(o||inn) sub.push(`${label(o)||'-'} → ${label(inn)||'-'}`)}
 return `${name}監督 XI\n\nFormation: ${f}\n\nPrediction:\n前半 日本 ${n('fhJ')}-${n('fhN')} オランダ\n後半 日本 ${n('shJ')}-${n('shN')} オランダ\n合計 日本 ${n('fhJ')+n('shJ')}-${n('fhN')+n('shN')} オランダ\n\nCaptain:\n${c?full(c):'-'}\n\nStarting XI:\n${xi}\n\nSubstitutions:\n${sub.length?sub.join('\n'):'-'}`;
}
function refresh(){updateSelectOptions(); refreshCaptain(); refreshSubOut(); refreshScore(); renderRoster(); updateHero(); updatePhoto(); summary.textContent=summaryText(); save()}
function save(){const data={managerName:managerName.value,theme:theme.value,formation:formation.value,starters:[...document.querySelectorAll('.starter')].map(s=>s.value),captain:captain.value,score:['fhJ','fhN','shJ','shN'].reduce((o,id)=>(o[id]=document.getElementById(id).value,o),{}),subs:Array.from({length:5},(_,i)=>({out:document.getElementById('subOut'+i).value,inn:document.getElementById('subIn'+i).value})),photo:avatar.querySelector('img')?.src||'',scale:photoScale.value,x:photoX.value,y:photoY.value}; localStorage.setItem(key,JSON.stringify(data))}
function load(){try{const d=JSON.parse(localStorage.getItem(key)||'{}'); managerName.value=d.managerName||''; theme.value=d.theme||'theme-home-blue'; formation.value=d.formation||'3-4-2-1'; ['fhJ','fhN','shJ','shN'].forEach(id=>{if(d.score&&d.score[id]!=null) document.getElementById(id).value=d.score[id]}); photoScale.value=d.scale||1; photoX.value=d.x||0; photoY.value=d.y||0; if(d.photo) avatar.innerHTML=`<img src="${d.photo}">`; return d}catch(e){return {}}}
document.addEventListener('DOMContentLoaded',()=>{
 renderFormationOptions(); renderSubs(); const d=load(); renderPitch();
 if(Array.isArray(d.starters)) document.querySelectorAll('.starter').forEach((s,i)=>{if(d.starters[i]) s.value=d.starters[i]});
 if(Array.isArray(d.subs)) d.subs.forEach((r,i)=>{document.getElementById('subOut'+i).value=r.out||''; document.getElementById('subIn'+i).value=r.inn||''});
 if(d.captain) captain.value=d.captain;
 document.querySelectorAll('input,select').forEach(el=>{if(el.id!=='photo') el.addEventListener('input',refresh); el.addEventListener('change',refresh)});
 formation.addEventListener('change',renderPitch);
 photo.addEventListener('change',e=>{const file=e.target.files[0]; if(!file)return; const r=new FileReader(); r.onload=()=>{avatar.innerHTML=`<img src="${r.result}">`; refresh()}; r.readAsDataURL(file)});
 copyBtn.onclick=async()=>{await navigator.clipboard.writeText(summaryText()); copyBtn.textContent='Copied!'; setTimeout(()=>copyBtn.textContent='Copy Text',900)};
 resetBtn.onclick=()=>{localStorage.removeItem(key); location.reload()};
 refresh();
});
</script>
</body></html>
